name: Validate Audio Separator models

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: [registry.json]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Same-repository PR to validate and update
        required: true
        type: number

concurrency:
  group: audio-separator-smoke-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions: {}

jobs:
  smoke:
    if: >-
      github.repository_id == '1332928462' &&
      github.repository_owner_id == '73347504' &&
      github.actor_id == '73347504' &&
      github.triggering_actor == 'HAGerox' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event.pull_request.draft == false &&
        github.event.pull_request.user.id == 73347504 &&
        github.event.pull_request.head.repo.id == 1332928462 &&
        github.event.pull_request.base.ref == 'main'))
    runs-on: macos-15
    timeout-minutes: 360
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      passed: ${{ steps.result.outputs.passed }}
      failed: ${{ steps.result.outputs.failed }}
      tested: ${{ steps.result.outputs.tested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - name: Resolve and authorize the owner PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          gh api "repos/HAGerox/Stem-Separator-Models/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          python3 trusted/scripts/workflow_policy.py \
            --pr-json "$RUNNER_TEMP/pr.json" \
            --trusted-sha "$(git -C trusted rev-parse HEAD)" --output "$GITHUB_OUTPUT"
          head_sha=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["head"]["sha"])' "$RUNNER_TEMP/pr.json")
          mkdir proposed
          gh api "repos/HAGerox/Stem-Separator-Models/contents/registry.json?ref=$head_sha" \
            --jq .content | base64 --decode > proposed/registry.json

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.10.11
          enable-cache: false

      - name: Install the exact Audio Separator runtime
        id: runtime
        run: |
          requirement=$(PYTHONPATH=trusted/scripts python3 -c \
            'from smoke_policy import AUDIO_SEPARATOR_REQUIREMENT; print(AUDIO_SEPARATOR_REQUIREMENT)')
          uv venv --python 3.12 --clear "$RUNNER_TEMP/audio-separator-smoke"
          uv pip install \
            --python "$RUNNER_TEMP/audio-separator-smoke/bin/python" \
            "$requirement" "librosa==0.10.2.post1"
          # The pinned runtime still uses get_duration(filename=...), removed
          # by librosa 1.0. Keep its dependency environment reproducible.
          echo "binary=$RUNNER_TEMP/audio-separator-smoke/bin/audio-separator" >> "$GITHUB_OUTPUT"

      - name: Prepare the public vocal smoke fixture
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
          python3 trusted/scripts/fetch_evaluation_tracks.py \
            --manifest trusted/evaluation/tracks.json \
            --output-dir "$RUNNER_TEMP/evaluation-audio" \
            --cache-dir "$RUNNER_TEMP/evaluation-source-cache"
          ffmpeg -hide_banner -loglevel error -y \
            -t 6 -i "$RUNNER_TEMP/evaluation-audio/karm-ready-excited.wav" \
            -c:a pcm_s16le "$RUNNER_TEMP/public-vocal-smoke.wav"

      - name: Validate proposed registry as data
        run: python3 trusted/scripts/validate.py proposed/registry.json

      - name: Run pending exact-checkpoint smokes
        run: |
          python3 trusted/scripts/smoke_audio_separator.py run \
            --base-registry trusted/registry.json \
            --registry proposed/registry.json \
            --output-registry proposed/registry.json \
            --audio-separator "${{ steps.runtime.outputs.binary }}" \
            --cache-dir "$RUNNER_TEMP/stem-separator-model-cache" \
            --report-dir "$RUNNER_TEMP/audio-separator-reports" \
            --summary-output "$RUNNER_TEMP/audio-separator-summary.md" \
            --fixture-file "$RUNNER_TEMP/public-vocal-smoke.wav" \
            --fixture-id public-vocal-ccby-v1 \
            --jobs 2 \
            --all-pending

      - name: Regenerate and validate promoted data
        run: |
          python3 trusted/scripts/product_catalog.py \
            --registry proposed/registry.json \
            --output proposed/product-catalog.json
          python3 trusted/scripts/validate.py proposed/registry.json
          python3 trusted/scripts/smoke_audio_separator.py verify-transitions \
            --base-registry trusted/registry.json \
            --registry proposed/registry.json

      - id: result
        name: Read smoke result
        run: |
          python3 - "$RUNNER_TEMP/audio-separator-reports/summary.json" "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, sys
          report = json.loads(pathlib.Path(sys.argv[1]).read_text())
          with pathlib.Path(sys.argv[2]).open("a") as output:
              output.write(f"passed={report['passed']}\n")
              output.write(f"failed={report['failed']}\n")
              output.write(f"tested={len(report['models'])}\n")
          PY

      - name: Package promoted registry and reports
        run: |
          mkdir -p "$RUNNER_TEMP/audio-separator-package/reports"
          cp proposed/registry.json "$RUNNER_TEMP/audio-separator-package/registry.json"
          cp proposed/product-catalog.json "$RUNNER_TEMP/audio-separator-package/product-catalog.json"
          python3 - "$RUNNER_TEMP/audio-separator-reports" "$RUNNER_TEMP/audio-separator-package/reports" <<'PY'
          import shutil, sys
          shutil.copytree(sys.argv[1], sys.argv[2], dirs_exist_ok=True,
                          ignore=shutil.ignore_patterns("models"))
          PY
          cp "$RUNNER_TEMP/audio-separator-summary.md" "$RUNNER_TEMP/audio-separator-package/summary.md"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: audio-separator-smoke-pr-${{ steps.pr.outputs.number }}
          path: ${{ runner.temp }}/audio-separator-package
          retention-days: 1

  promote:
    needs: smoke
    if: needs.smoke.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.smoke.outputs.base_sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: audio-separator-smoke-pr-${{ needs.smoke.outputs.pr_number }}
          path: ${{ runner.temp }}/audio-separator-package
      - name: Commit successful promotions to the PR
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ needs.smoke.outputs.head_ref }}
          HEAD_SHA: ${{ needs.smoke.outputs.head_sha }}
          BASE_SHA: ${{ needs.smoke.outputs.base_sha }}
          PR_NUMBER: ${{ needs.smoke.outputs.pr_number }}
          GIT_INDEX_FILE: ${{ runner.temp }}/promotion-index
        run: |
          gh api "repos/HAGerox/Stem-Separator-Models/pulls/$PR_NUMBER" > "$RUNNER_TEMP/current-pr.json"
          python3 trusted/scripts/workflow_policy.py \
            --pr-json "$RUNNER_TEMP/current-pr.json" \
            --trusted-sha "$BASE_SHA" --expected-head "$HEAD_SHA"
          git -C trusted fetch origin "$HEAD_SHA"
          git -C trusted show "$HEAD_SHA:registry.json" > "$RUNNER_TEMP/original-registry.json"
          python3 trusted/scripts/smoke_audio_separator.py verify-promotions \
            --registry "$RUNNER_TEMP/original-registry.json" \
            --promoted-registry "$RUNNER_TEMP/audio-separator-package/registry.json"
          python3 trusted/scripts/validate.py "$RUNNER_TEMP/audio-separator-package/registry.json"
          python3 trusted/scripts/product_catalog.py \
            --registry "$RUNNER_TEMP/audio-separator-package/registry.json" \
            --output "$RUNNER_TEMP/product-catalog.json"
          cmp "$RUNNER_TEMP/product-catalog.json" \
            "$RUNNER_TEMP/audio-separator-package/product-catalog.json"
          # Build the commit without checking out the PR tree, invoking its
          # attributes, or running any proposed code in this write-capable job.
          git -C trusted config user.name "stem-separator-smoke[bot]"
          git -C trusted config user.email "stem-separator-smoke[bot]@users.noreply.github.com"
          git -C trusted read-tree "$HEAD_SHA"
          for file in registry.json product-catalog.json; do
            blob=$(git -C trusted hash-object -w --no-filters "$RUNNER_TEMP/audio-separator-package/$file")
            git -C trusted update-index --add --cacheinfo "100644,$blob,$file"
          done
          tree=$(git -C trusted write-tree)
          if [ "$tree" != "$(git -C trusted rev-parse "$HEAD_SHA^{tree}")" ]; then
            commit=$(git -C trusted commit-tree "$tree" -p "$HEAD_SHA" -m "Validate Audio Separator model artifacts")
            gh api "repos/HAGerox/Stem-Separator-Models/pulls/$PR_NUMBER" > "$RUNNER_TEMP/current-pr.json"
            python3 trusted/scripts/workflow_policy.py \
              --pr-json "$RUNNER_TEMP/current-pr.json" \
              --trusted-sha "$BASE_SHA" --expected-head "$HEAD_SHA"
            gh auth setup-git
            git -C trusted push "https://github.com/HAGerox/Stem-Separator-Models.git" "$commit:refs/heads/$HEAD_REF"
          fi
      - name: Post the result to the PR
        if: needs.smoke.outputs.tested != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.smoke.outputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
        run: >-
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY"
          --body-file "$RUNNER_TEMP/audio-separator-package/summary.md"

      - name: Fail when any model failed validation
        if: needs.smoke.outputs.failed != '0'
        run: |
          echo "One or more exact-checkpoint Audio Separator smokes failed." >&2
          exit 1
