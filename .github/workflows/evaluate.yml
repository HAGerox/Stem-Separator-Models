name: Compare model recommendation

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request containing the proposed recommendation
        required: true
        type: number
      stem:
        description: Stem to compare, e.g. vocals or instrumental
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  compare:
    runs-on: [self-hosted, stem-evaluation]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - name: Read proposed registry from the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          git fetch origin "pull/$PR_NUMBER/head"
          git show FETCH_HEAD:registry.json > proposed-registry.json
          python3 scripts/validate.py proposed-registry.json
      - name: Compare current and proposed models
        env:
          STEM: ${{ inputs.stem }}
          PROPOSED_REGISTRY: proposed-registry.json
          TRACKS_FILE: evaluation/tracks.local.json
          AUDIO_DIR: ${{ vars.EVALUATION_AUDIO_DIR || '/opt/stem-registry/tracks' }}
          OUTPUT_DIR: evaluation/results/${{ github.run_id }}
        run: python3 scripts/evaluate.py
      - id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: comparison-pr-${{ inputs.pr_number }}-${{ inputs.stem }}
          path: evaluation/results/${{ github.run_id }}
          retention-days: 14
      - name: Write the artifact into the structured PR body
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          TRACKS_FILE: evaluation/tracks.local.json
        run: |
          python3 scripts/pr_body.py \
            --base-ref origin/main \
            --registry proposed-registry.json \
            --artifact-url "$ARTIFACT_URL" \
            --output PR_BODY.md
          gh pr edit "$PR_NUMBER" --body-file PR_BODY.md
