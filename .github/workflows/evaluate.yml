name: Compare registry recommendations

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: [registry.json]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request containing the proposed recommendation
        required: true
        type: number

permissions: {}

concurrency:
  group: recommendation-comparison-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  compare:
    if: >-
      github.repository_id == '1332928462' &&
      github.repository_owner_id == '73347504' &&
      github.actor_id == '73347504' &&
      github.triggering_actor == 'HAGerox' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event.pull_request.draft == false &&
        github.event.pull_request.user.id == 73347504 &&
        github.event.pull_request.head.repo.id == 1332928462 &&
        github.event.pull_request.base.ref == 'main'))
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      count: ${{ steps.delta.outputs.count }}
      ready: ${{ steps.delta.outputs.ready }}
      task: ${{ steps.delta.outputs.task }}
      artifact_url: ${{ steps.artifact.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve and authorize the owner PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          gh api "repos/HAGerox/Stem-Separator-Models/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          python3 scripts/workflow_policy.py \
            --pr-json "$RUNNER_TEMP/pr.json" \
            --trusted-sha "$(git rev-parse HEAD)" --output "$GITHUB_OUTPUT"
          head_sha=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["head"]["sha"])' "$RUNNER_TEMP/pr.json")
          gh api "repos/HAGerox/Stem-Separator-Models/contents/registry.json?ref=$head_sha" \
            --jq .content | base64 --decode > proposed-registry.json
          python3 scripts/validate.py proposed-registry.json
      - name: Detect a runnable recommendation selection change
        id: delta
        run: |
          python3 - "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, "scripts")
          from evaluate import changed_tasks
          base = json.loads(pathlib.Path("registry.json").read_text())
          proposed = json.loads(pathlib.Path("proposed-registry.json").read_text())
          tasks = changed_tasks(base, proposed)
          ready = False
          if len(tasks) == 1:
              task = tasks[0]
              selected = proposed["recommendations"][task]["model"]
              model = next(model for model in proposed["models"] if model["id"] == selected)
              backend = model.get("backends", {}).get("audio_separator", {})
              ready = backend.get("state") == "validated" and backend.get("validated") is True
          with pathlib.Path(sys.argv[1]).open("a") as output:
              output.write(f"count={len(tasks)}\n")
              output.write(f"task={tasks[0] if len(tasks) == 1 else ''}\n")
              output.write(f"ready={'true' if ready else 'false'}\n")
          PY
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        if: steps.delta.outputs.count == '1' && steps.delta.outputs.ready == 'true'
        with:
          version: 0.10.11
          enable-cache: false
      - name: Install the exact Audio Separator runtime
        id: runtime
        if: steps.delta.outputs.count == '1' && steps.delta.outputs.ready == 'true'
        run: |
          requirement=$(PYTHONPATH=scripts python3 -c \
            'from smoke_policy import AUDIO_SEPARATOR_REQUIREMENT; print(AUDIO_SEPARATOR_REQUIREMENT)')
          uv venv --python 3.12 --clear "$RUNNER_TEMP/audio-separator-evaluation"
          uv pip install \
            --python "$RUNNER_TEMP/audio-separator-evaluation/bin/python" \
            "$requirement" "librosa==0.10.2.post1"
          echo "binary=$RUNNER_TEMP/audio-separator-evaluation/bin/audio-separator" >> "$GITHUB_OUTPUT"
      - name: Prepare public listening fixtures
        if: steps.delta.outputs.count == '1' && steps.delta.outputs.ready == 'true'
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
          python3 scripts/fetch_evaluation_tracks.py \
            --manifest evaluation/tracks.json \
            --output-dir "$RUNNER_TEMP/evaluation-audio" \
            --cache-dir "$RUNNER_TEMP/evaluation-source-cache"
      - name: Compare current and proposed models
        if: steps.delta.outputs.count == '1' && steps.delta.outputs.ready == 'true'
        env:
          PROPOSED_REGISTRY: proposed-registry.json
          TRACKS_FILE: evaluation/tracks.json
          AUDIO_DIR: ${{ runner.temp }}/evaluation-audio
          OUTPUT_DIR: evaluation/results/${{ github.run_id }}
          MODEL_CACHE_DIR: ${{ runner.temp }}/stem-separator-model-cache
          MODEL_STAGING_DIR: ${{ runner.temp }}/evaluation-models
          AUDIO_SEPARATOR: ${{ steps.runtime.outputs.binary }}
        run: python3 scripts/evaluate.py
      - name: Require one existing recommendation replacement per comparison
        if: steps.delta.outputs.count != '0' && steps.delta.outputs.count != '1'
        run: |
          echo "A registry PR may replace at most one existing recommendation selection." >&2
          exit 1
      - id: artifact
        if: steps.delta.outputs.count == '1' && steps.delta.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: comparison-pr-${{ steps.pr.outputs.number }}
          path: evaluation/results/${{ github.run_id }}
          retention-days: 14

  publish:
    needs: compare
    if: needs.compare.result == 'success' && needs.compare.outputs.count == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.compare.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reauthorize the unchanged owner PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.compare.outputs.pr_number }}
          HEAD_SHA: ${{ needs.compare.outputs.head_sha }}
          BASE_SHA: ${{ needs.compare.outputs.base_sha }}
        run: |
          gh api "repos/HAGerox/Stem-Separator-Models/pulls/$PR_NUMBER" > "$RUNNER_TEMP/current-pr.json"
          python3 scripts/workflow_policy.py \
            --pr-json "$RUNNER_TEMP/current-pr.json" \
            --trusted-sha "$BASE_SHA" --expected-head "$HEAD_SHA"
          gh api "repos/HAGerox/Stem-Separator-Models/contents/registry.json?ref=$HEAD_SHA" \
            --jq .content | base64 --decode > proposed-registry.json
          python3 scripts/validate.py proposed-registry.json
      - name: Write the artifact into the structured PR body
        if: needs.compare.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.compare.outputs.pr_number }}
          ARTIFACT_URL: ${{ needs.compare.outputs.artifact_url }}
          TRACKS_FILE: evaluation/tracks.json
        run: |
          python3 - <<'PY'
          import os, re
          expected = rf"https://github\.com/HAGerox/Stem-Separator-Models/actions/runs/{os.environ['GITHUB_RUN_ID']}/artifacts/[0-9]+"
          if not re.fullmatch(expected, os.environ["ARTIFACT_URL"]):
              raise SystemExit("Unexpected comparison artifact URL")
          PY
          python3 scripts/pr_body.py \
            --base-ref origin/main \
            --registry proposed-registry.json \
            --artifact-url "$ARTIFACT_URL" \
            --output PR_BODY.md
          gh pr edit "$PR_NUMBER" --repo HAGerox/Stem-Separator-Models --body-file PR_BODY.md
      - name: Explain why comparison was deferred
        if: needs.compare.outputs.ready != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.compare.outputs.pr_number }}
          TASK: ${{ needs.compare.outputs.task }}
        run: >-
          gh pr comment "$PR_NUMBER" --repo HAGerox/Stem-Separator-Models
          --body "Listening comparison for \`$TASK\` will run automatically after its proposed model passes the exact-checkpoint Audio Separator smoke."
