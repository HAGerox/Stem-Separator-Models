name: Validate registry

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Validate data
        run: python3 scripts/validate.py
      - name: Validate generated product catalogue
        run: python3 scripts/product_catalog.py --check
      - name: Require smoke evidence for validated backend changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          git show "$BASE_REF:registry.json" > /tmp/base-registry.json
          python3 scripts/smoke_audio_separator.py verify-transitions \
            --base-registry /tmp/base-registry.json \
            --registry registry.json
      - name: Compile scripts
        run: python3 -m py_compile scripts/*.py
      - name: Test product policy
        run: python3 -m unittest discover -s tests
      - name: Validate structured PR delta
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: python3 scripts/pr_body.py --base-ref "$BASE_REF" --output /tmp/PR_BODY.md
